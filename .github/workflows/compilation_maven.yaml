name: compilation
on: 
    push:
        branches:
            - main

# Ma définition de job qui va s'exécuter sur la machine virtuelle
jobs:
    compilation: #nom donnée
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: '21'
            
            - name: Fournir accès au runner
              run: chmod +x mvnw

            - name: Compilation du projet Maven
              run: ./mvnw compile

            - name: Compilation test
              run: ./mvnw test

            - name: Publier le rapport de tests
              uses: actions/upload-artifact@v5
              with:
                name: rapport-surefire
                path: target/surefire-reports/

            - name: Build
              run: ./mvnw -B clean package -DskipTests   # produit le .jar dans target/
              
            - name: Publier le .jar en artefact
              uses: actions/upload-artifact@v5
              with:
                name: application-jar
                path: target/*.jar          # ex. target/spring-petclinic-rest-*.jar

            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
                java-version: '25'
                distribution: 'temurin'
                cache: maven          # met en cache ~/.m2/repository entre les exécutions
